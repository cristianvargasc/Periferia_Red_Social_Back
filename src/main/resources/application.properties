spring.application.name=back

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:red_social}
spring.datasource.username=${DB_USER:red_social_user}
spring.datasource.password=${DB_PASSWORD:red_social_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Settings
app.jwt.secret=9a67a86c75f62e858e858fbc8d8f7893a7493a3b5c6d7e8f90a1b2c3d4e5f607
# 24 hours in milliseconds
app.jwt.expiration=86400000

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Enable WebSockets tracing (observability)
logging.level.org.springframework.web.socket=DEBUG
logging.level.com.redsocial.back=INFO
